name: CI Pipeline AI4I

on:
  push:
    branches:
      - main
      - actividad-9-scalability-governance
      - fase-3-mlops
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Ejecutar pruebas automatizadas
        run: pytest -v

      - name: Validar importación de la API
        run: python -c "import app; print('API validada correctamente')"

      - name: Construir imagen Docker
        run: docker build -t ai4i-predictive-maintenance .

      - name: Simular despliegue continuo
        run: |
          echo "Pipeline validado"
          echo "Imagen Docker construida"
          echo "Despliegue simulado completado"